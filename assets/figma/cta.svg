<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
<rect width="1200" height="480" fill="#0F172A"/>
<text x="80" y="100" font-family="Inter, sans-serif" font-size="32px" font-weight="700" fill="#F1F5F9">Присоединяйтесь к созданию ИМТ</text>
<text x="80" y="140" font-family="Inter, sans-serif" font-size="16px" font-weight="400" fill="#94A3B8">Концепция открыта для всех участников градостроительной деятельности.</text>
<text x="80" y="170" font-family="Inter, sans-serif" font-size="16px" font-weight="400" fill="#94A3B8">Выберите свой путь:</text>
<rect x="80" y="218" width="348" height="180" fill="rgba(255,255,255,0.06)" rx="12"/>
<text x="96" y="248" font-family="Inter, sans-serif" font-size="18px" font-weight="700" fill="#F1F5F9">Для регионов</text>
<text x="96" y="276" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Хотите оценить экономический эффект</text>
<text x="96" y="300" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">ИМТ для вашего региона?</text>
<rect x="96" y="332" width="180" height="42" fill="#2563EB" rx="8"/>
<text x="104" y="358" font-family="Inter, sans-serif" font-size="14px" font-weight="600" fill="#ffffff">Связаться с нами</text>
<rect x="446" y="218" width="348" height="180" fill="rgba(255,255,255,0.06)" rx="12"/>
<text x="462" y="248" font-family="Inter, sans-serif" font-size="18px" font-weight="700" fill="#F1F5F9">Для девелоперов</text>
<text x="462" y="276" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Протестируйте</text>
<text x="462" y="300" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">анализ участка в 1 клик</text>
<rect x="462" y="332" width="180" height="42" fill="#2563EB" rx="8"/>
<text x="470" y="358" font-family="Inter, sans-serif" font-size="14px" font-weight="600" fill="#ffffff">Хочу попробовать</text>
<rect x="812" y="218" width="348" height="180" fill="rgba(255,255,255,0.06)" rx="12"/>
<text x="828" y="248" font-family="Inter, sans-serif" font-size="18px" font-weight="700" fill="#F1F5F9">Для всех</text>
<text x="828" y="276" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Подпишитесь на Telegram-канал</text>
<text x="828" y="300" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">#ГИСОГД</text>
<rect x="828" y="332" width="180" height="42" fill="#2563EB" rx="8"/>
<text x="836" y="358" font-family="Inter, sans-serif" font-size="14px" font-weight="600" fill="#ffffff">Telegram-канал</text>
</svg>