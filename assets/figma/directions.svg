<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<rect width="1200" height="760" fill="#0F172A"/>
<rect x="80" y="56" width="150" height="26" fill="rgba(255,255,255,0.08)" rx="12"/>
<text x="92" y="72" font-family="Inter, sans-serif" font-size="12px" font-weight="600" fill="#94A3B8">Дорожная карта</text>
<text x="80" y="118" font-family="Inter, sans-serif" font-size="32px" font-weight="700" fill="#F1F5F9">7 направлений реализации ИМТ</text>
<rect x="80" y="168" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="96" y="210" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">01</text>
<text x="140" y="198" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Переход к ИМТ</text>
<text x="140" y="222" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Законодательно закрепить понятие ИМТ, определить требования и стандарты</text>
<rect x="650" y="168" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="666" y="210" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">02</text>
<text x="710" y="198" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Автоматизация услуг</text>
<text x="710" y="222" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">От точечных услуг к комплексной автоматизации на основе данных</text>
<rect x="80" y="252" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="96" y="294" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">03</text>
<text x="140" y="282" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Электронное согласование</text>
<text x="140" y="306" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Замена бумажных процессов цифровым взаимодействием</text>
<rect x="650" y="252" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="666" y="294" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">04</text>
<text x="710" y="282" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">КРТ, мастер-планы</text>
<text x="710" y="306" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Цифровая среда для комплексного развития территорий</text>
<rect x="80" y="336" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="96" y="378" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">05</text>
<text x="140" y="366" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Витрина данных ГИСОГД</text>
<text x="140" y="390" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Единая точка доступа к данным через СМЭВ 4</text>
<rect x="650" y="336" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="666" y="378" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">06</text>
<text x="710" y="366" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Публичность и открытые данные</text>
<text x="710" y="390" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Доступ к градостроительной информации для всех</text>
<rect x="80" y="420" width="540" height="72" fill="rgba(255,255,255,0.04)" rx="10"/>
<text x="96" y="462" font-family="Inter, sans-serif" font-size="24px" font-weight="700" fill="#475569">07</text>
<text x="140" y="450" font-family="Inter, sans-serif" font-size="16px" font-weight="600" fill="#F1F5F9">Инженерные сети</text>
<text x="140" y="474" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#94A3B8">Включение РСО в единую цифровую среду</text>
</svg>