<text x="96" y="580" font-family="Inter, sans-serif" font-size="14px" font-weight="600" fill="#374151">Связь с национальными целями (Указ Президента №309):</text>
<text x="96" y="604" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#4B5563">• Комфортная и безопасная среда для жизни — +30% к 2030, +60% к 2036</text>
<text x="96" y="624" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#4B5563">• Цифровая трансформация — 99% услуг онлайн, цифровая зрелость отраслей</text>
