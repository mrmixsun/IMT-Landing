<text x="800" y="426" font-family="Inter, sans-serif" font-size="14px" font-weight="600" fill="#059669">да</text>
<line x1="80" y1="504" x2="1120" y2="504" stroke="#F1F5F9" stroke-width="1"/>
<text x="80" y="478" font-family="Inter, sans-serif" font-size="14px" font-weight="400" fill="#111827">Качество городской среды (Указ 309)</text>
