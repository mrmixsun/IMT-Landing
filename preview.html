<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SVG Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0F172A; padding: 40px; font-family: Inter, sans-serif; }
        h1 { color: #F1F5F9; margin-bottom: 32px; font-size: 24px; letter-spacing: -0.02em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 32px; }
        .item { background: #1E293B; border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); }
        .item__title { color: #94A3B8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
        .item svg { width: 100%; height: auto; }
    </style>
</head>
<body>
    <h1>Иллюстрации для IMT-Landing</h1>
    <div class="grid" id="grid"></div>
    <script>
        const files = [
            'hero-illustration.svg', 'solution-illustration.svg', 'directions-illustration.svg',
            'gems-illustration.svg', 'audience-illustration.svg', 'problem-illustration.svg',
            'effects-illustration.svg'
        ];
        const titles = {
            'hero-illustration.svg': 'Hero — Цифровая территория',
            'solution-illustration.svg': 'Решение — Архитектура платформы',
            'directions-illustration.svg': 'Дорожная карта — Таймлайн',
            'gems-illustration.svg': 'GEMS — Дашборд статов',
            'audience-illustration.svg': 'Аудитория — 3 группы',
            'problem-illustration.svg': 'Проблема — PDF vs Данные',
            'effects-illustration.svg': 'Эффекты — До / После',
        };
        const grid = document.getElementById('grid');
        files.forEach(f => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div class="item__title">${titles[f] || f}</div><object data="assets/img/${f}" type="image/svg+xml"></object>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
